/* repères de date */
const pad2 = (n) => String(n).padStart(2, "0");
const formatISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseISO = (iso) => {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
};
function addDaysISO(iso, days) {

function mondayOf(iso) {

const minutesOf = (time) => { const [h, m] = time.split(":").map(Number); return h * 60 + m; };

const stripAccents = (value) => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");

/** Format CELCAT : les 6 rubriques sont séparées par « \r\n\r\n<br />\r\n\r\n ». */
const SECTION_SEP = /(?:\r?\n){2}\s*<br\s*\/?>\s*(?:\r?\n){2}/i;
const FAMILIES = [
  ["maths", /analys|alg[eè]bre|alg\b|math|lsma/i],
  ["socio", /socio|d[ée]mograph|lsso/i],
  ["micro", /micro|lsec311/i],
  ["macro", /macro|lsec312/i],
  ["anglais", /anglais|lsang|langue/i],
  ["info", /base de donn|bdd|initiation|informatique|num[ée]rique|lsin/i],
];
const ROOM_RE = /fermat|descartes|joliot|curie|germain|buffon|amphi|moodle|distanciel|cartable|salle|^\s*(?:rc|e|b|g|a|f|c|d)\s?-?\s?\d{2,4}\b|^\s*\d{3,5}\s*[-\u2013]\s*[a-z]/i;
const NAMED_ENTITIES = { amp: "&", lt: "<", gt: ">", quot: '"', apos: "'", nbsp: "\u00a0", eacute: "é", egrave: "è", agrave: "à", ecirc: "ê", ccedil: "ç", ugrave: "ù", ocirc: "ô", icirc: "î", acirc: "â", ucirc: "û", euml: "ë", iuml: "ï", egrave: "è", deg: "°", hellip: "…", rsquo: "’", lsquo: "‘", laquo: "«", raquo: "»", mdash: "—", ndash: "–", middot: "·", euro: "€", times: "×", copy: "©", uuml: "ü", ouml: "ö", auml: "ä", ccedil: "ç", oelig: "œ", nbsp: "\u00a0" };
function decodeEntities(value) {
  return String(value ?? "").replace(/&(#[xX]?[0-9a-fA-F]+|[a-zA-Z][a-zA-Z0-9]*);/g, (match, entity) => {
    if (entity[0] === "#") {
      const code = entity[1] === "x" || entity[1] === "X" ? parseInt(entity.slice(2), 16) : Number(entity.slice(1));
      return Number.isFinite(code) && code > 0 ? String.fromCodePoint(code) : match;
    }
    return NAMED_ENTITIES[entity.toLowerCase()] ?? match;
  });
}

function cleanFragment(fragment) {
  return decodeEntities(String(fragment ?? "").replace(/<br\s*\/?>/gi, "\n"))
    .replace(/<[^>]*>/g, " ")
    .replace(/\s*\n\s*/g, "\n")
    .split("\n")
    .map((line) => line.replace(/\s+/g, " ").trim())
    .filter(Boolean);
}

function stripResourceSuffix(value) {
  return String(value).replace(/\s*\[[^\]]*\]\s*$/, "").trim();
}
function stripCapacity(value) {
  return String(value).replace(/\s*\(\s*\d+\s*\/\s*\d+\s*\)\s*/g, " ").replace(/\s+/g, " ").trim();
}
function normalizeModuleName(value) {
  const name = stripResourceSuffix(value).replace(/^(?:[A-Z0-9_*]{4,}\s*[-–]\s*)+/, "");
  return name.replace(/\s{2,}/g, " ").trim();
}
function familyOf(text) {
  const haystack = stripAccents(String(text ?? "")).toLowerCase();
  for (const [family, re] of FAMILIES) if (re.test(haystack)) return family;
  return "info";
}

/** Transforme un événement CELCAT brut en cours normalisé (sans DOM). */
const parseCache = new WeakMap();
function parseEvent(raw) {
  if (!raw || typeof raw !== "object") return null;
  const hit = parseCache.get(raw);
  if (hit !== undefined) return hit;
  const result = parseEventUncached(raw);
  parseCache.set(raw, result);
  return result;
}

/** Découpe la description CELCAT en rubriques (le <br /> sépare les rubriques). */
function splitSections(description) {
  return String(description ?? "")
    .split(/<br\s*\/?>/i)
    .map((fragment) => cleanFragment(fragment));
}

/**
 * Classe une ligne de description : « module » (matière), « group » (groupe
 * d'étudiants), « room » (salle) ou « note ». Les codes de matière fournis par
 * l'API (raw.modules, ex. LSIN311) sont le signal le plus fiable.
 */
function classifyLine(line, moduleCodes) {
  // Une salle peut se terminer par un suffixe entre crochets
  // (« 2203 - FERMAT [Salle de TD] ») : on la reconnaît avant tout.
  if (ROOM_RE.test(line)) return "room";
  const bracket = (line.match(/\[([^\]]+)\]\s*$/) || [, ""])[1].trim();
  if (bracket) {
    const clean = (value) => stripAccents(value).toUpperCase().replace(/\*/g, "").trim();
    const isModuleCode = moduleCodes.some((code) => clean(String(code)) === clean(bracket));
    if (isModuleCode && !/MIASHS|TD\s?\d/i.test(line)) return "module";
    return "group";
  }
  return "note";
}

function parseEventUncached(raw) {
  const start = String(raw.start ?? "");
  const end = String(raw.end ?? "");
  if (!start || !end || start.length < 16 || end.length < 16) return null;
  const moduleCodes = Array.isArray(raw.modules) ? raw.modules.map((code) => String(code)) : [];
  const sections = splitSections(raw.description);
  const buckets = { module: [], group: [], room: [], note: [] };
  for (const section of sections) {
    const lines = section.filter(Boolean);
    if (!lines.length) continue;
    const kind = classifyLine(lines[0], moduleCodes);
    for (const line of lines) buckets[kind].push(line);
  }
  const type = (sections[0]?.filter(Boolean)[0] || "").trim() || stripResourceSuffix(String(raw.eventCategory ?? "")).trim();
  const modules = buckets.module.map((line) => stripCapacity(normalizeModuleName(line))).filter(Boolean);
  const rooms = buckets.room.map((line) => stripCapacity(stripResourceSuffix(line))).filter(Boolean);
  const notes = buckets.note.join(" · ");

  const background = String(raw.backgroundColor ?? "").toLowerCase();
  const cancelled = /annul|supprim|absent|indispon|report[ée]|gr[eè]ve|emp[eê]ch|ferm[eé]/i.test(`${type} ${raw.eventCategory ?? ""} ${notes}`) || ["#333333", "#333", "#ff0000", "#ff000080", "red"].includes(background);
  const title = modules[0] || stripResourceSuffix(moduleCodes[0] || "") || type || "Cours";
  const startMin = minutesOf(start.slice(11, 16));
  const endMin = minutesOf(end.slice(11, 16));
  return {
    id: String(raw.id ?? `${start}-${end}-${title}`),
    date: start.slice(0, 10),
    startMin,
    endMin,
    time: slotOf(startMin, endMin),
    type: type || "Cours",
    title,
    cat: familyOf(`${title} ${moduleCodes.join(" ")} ${type}`),
    codes: moduleCodes,
    room: rooms.join(" / "),
    groups: buckets.group,
    note: notes,
    cancelled,
    source: "live",
  };
}

/** Code entre crochets d'une ligne de ressource CELCAT (« L2 MIASHS S3 TD 2 [S3MIASHS TD 2] »). */
function resourceCode(line) {
  const match = String(line).match(/\[([^\]]+)\]\s*$/);
  return (match ? match[1] : String(line)).trim();
}
function normalizeGroupCode(code) {
  return stripAccents(String(code ?? ""))
    .toUpperCase()
    .replace(/\s+/g, " ")
    .replace(/\bTD\s?0?(\d)\b/g, "TD $1")
    .trim();
}

/** Ne garde que les cours de la promo (CM / TD réunies) et du TD de l'étudiant. */
function isMyCourse(parsed, config = CONFIG) {
  if (!parsed.groups.length) return true;
  const wanted = new Set([normalizeGroupCode(config.group), normalizeGroupCode(config.myTd)]);
  return parsed.groups.some((group) => wanted.has(normalizeGroupCode(resourceCode(group))));
}

/** Étiquette affichée sur la carte (« CM Promo », « Votre TD », « TD Promo »…). */
function tagForLiveCourse(item) {
  if (item.cancelled) return { tag: "Annulé — prof absent / séance supprimée", tagType: "cancelled" };
  const codes = item.groups.map((group) => normalizeGroupCode(resourceCode(group)));
  const promo = codes.includes(normalizeGroupCode(CONFIG.group));
  const mine = codes.includes(normalizeGroupCode(CONFIG.myTd));
  if (/^CM/i.test(item.type)) return { tag: "CM Promo", tagType: "cm" };
  if (mine && promo) return { tag: "TD Promo réunie (TD 1 & 2)", tagType: "reuni" };
  if (mine) return { tag: `Votre ${item.type}`.trim(), tagType: "perso" };
  return { tag: `${CONFIG.group} • promo`, tagType: "reuni" };
}

/** Regroupe des événements bruts par semaine (clé = lundi ISO). */
function weeksFromEvents(events, fetchedAt = new Date().toISOString()) {
  const weeks = {};
  for (const raw of events) {
    const parsed = parseEvent(raw);
    if (!parsed) continue;
    const monday = mondayOf(parsed.date);
    weeks[monday] ??= { monday, fetchedAt, events: [] };
    weeks[monday].events.push(raw);
  }
  return weeks;
}

function overlaps(a, b, minimum = 30) {
  return Math.min(a.endMin, b.endMin) - Math.max(a.startMin, b.startMin) >= minimum;
}
const sameFamily = (courseA, courseB) => courseA.cat === courseB.cat;

/**
 * Construit les jours d'une semaine :
 *  - source live  : événements CELCAT filtrés + cours « fantômes » (dans la
 *                   référence mais absents du planning officiel) ;
 *  - source réf.  : emploi du temps codé en dur (mode hors-ligne).
 */
function buildWeek(weekKey, rawEvents, reference, options = {}) {
  const live = options.live !== false;
  const week = reference ?? null;
  const referenceDays = week ? week.days : [];
  const parsed = (rawEvents ?? [])
    .map((raw) => parseEvent(raw))
    .filter(Boolean)
    .filter((item) => isMyCourse(item));
  // Un cours « fantôme » n'a de sens que si la semaine a bien été récupérée :
  // une semaine vide (vacances, panne) ne doit pas transformer la référence.
  const ghostEnabled = parsed.length > 0;

  const days = [];

  for (let d = 0; d < 5; d++) {
    const dateISO = addDaysISO(weekKey, d);
    const realDate = parseISO(dateISO);
    const dayLive = parsed.filter((item) => item.date === dateISO).sort((a, b) => a.startMin - b.startMin);
    const dayReference = referenceDays[d]?.courses ?? [];
    const courses = [];

    if (!live) {
      for (const ref of dayReference) courses.push(referenceCourse(ref, dateISO));
      days.push({ name: DAY_NAMES[d], date: formatDate(realDate), realDate, courses, live: false });
      continue;
    }

    const used = new Set();
    for (const ref of dayReference) {
      const refStart = startMinutes(ref.time);
      const refEnd = endMinutes(ref.time);
      const refWindow = { startMin: refStart, endMin: refEnd, cat: ref.cat };
      const matches = dayLive.filter((item) => item.date === dateISO && !used.has(item.id) && sameFamily(refWindow, item) && overlaps(refWindow, item));
      if (matches.length) {
        for (const match of matches) {
          used.add(match.id);
          courses.push(mergeCourse(match, ref, dateISO));
        }
      } else if (ghostEnabled) {
        // Cours prévu au planning de secours, absent du planning officiel.
        courses.push({ ...referenceCourse(ref, dateISO), ghost: true, source: "ghost" });
      }
    }

    for (const item of dayLive) {
      if (used.has(item.id)) continue;
      const recurringCancelled = item.cancelled && options.recurringCancellations?.has(recurringKey(item));
      if (recurringCancelled) continue; // créneau suspendu en permanence : pas une information
      courses.push(liveCourse(item, dateISO));
    }

    courses.sort((a, b) => startMinutes(a.time) - startMinutes(b.time));
    days.push({ name: DAY_NAMES[d], date: formatDate(realDate), realDate, courses, live: true });
  }

  return { days, live };
}

function referenceCourse(ref, dateISO) {
  const start = startMinutes(ref.time);
  return {
    id: `ref-${dateISO}-${start}-${ref.title}`,
    date: dateISO,
    time: ref.time,
    startMin: start,
    endMin: endMinutes(ref.time),
    type: ref.type,
    title: ref.title,
    cat: ref.cat,
    room: ref.room,
    tag: ref.tag,
    tagType: ref.tagType,
    isCancelled: false,
    ghost: false,
    source: "reference",
  };
}

function mergeCourse(item, ref, dateISO) {
  const inherited = referenceCourse(ref, dateISO);
  return {
    ...liveCourse(item, dateISO),
    title: inherited.title || item.title,
    type: item.type.toLowerCase().startsWith("annul") ? inherited.type : item.type,
    tag: item.cancelled ? `${inherited.tag} • annulée` : inherited.tag,
    tagType: item.cancelled ? "cancelled" : inherited.tagType,
    note: item.note,
    source: "live-reference",
  };
}

function liveCourse(item, dateISO) {
  const { tag, tagType } = tagForLiveCourse(item);
  return {
    id: item.id,
    date: dateISO,
    time: item.time,
    startMin: item.startMin,
    endMin: item.endMin,
    type: item.type,
    title: item.title,
    cat: item.cat,
    room: item.room,
    tag,
    tagType,
    isCancelled: item.cancelled,
    ghost: false,
    note: item.note,
    groups: item.groups,
    source: "live",
  };
}

const weekdayIndex = (dateISO) => (parseISO(dateISO).getDay() + 6) % 7;
/** Clé d'un créneau annulé de façon récurrente : jour de semaine | heure | matière. */
const recurringKey = (item) => `${weekdayIndex(item.date)}|${item.time.split(" ")[0]}|${item.title}`;

/**
 * Repère les créneaux « annulés en permanence » (ex. le TD d'anglais du mardi
 * 13:50 du TD 02, supprimé chaque semaine) : même jour + heure + matière
 * annulés dans au moins 3 semaines différentes. Ce ne sont pas des nouvelles,
 * on ne les affiche donc pas.
 */
function findRecurringCancellations(weeks) {
  const counts = new Map();
  for (const week of Object.values(weeks ?? {})) {
    for (const raw of week.events ?? []) {
      const item = parseEvent(raw);
      if (!item || !item.cancelled || !isMyCourse(item)) continue;
      const key = recurringKey(item);
      const entry = counts.get(key) ?? new Set();
      entry.add(item.date);
      counts.set(key, entry);
    }
  }
  const weekCount = Object.keys(weeks ?? {}).length;
  const threshold = weekCount >= 6 ? 3 : Math.max(2, weekCount);
  const recurring = new Set();
  for (const [key, dates] of counts) if (dates.size >= threshold) recurring.add(key);
  return recurring;
}

/* ===== CORE-END ===== */

/* ======================================================================
   SOURCES DE DONNÉES
   ====================================================================== */
const state = {
  weeks: {},          // { 'YYYY-MM-DD': { monday, fetchedAt, events[] } }
  generatedAt: null,
};

/** Aligne la configuration de la page sur edt.config.json (si accessible). */
async function applyRemoteConfig() {
  try {
    const remote = await fetchJson(`edt.config.json?v=${Math.floor(Date.now() / 600000)}`, {}, 5000);
    if (!params.get("group") && remote?.group) CONFIG.group = String(remote.group).trim();
    if (!params.get("td") && !localStorage.getItem("schedule_td") && remote?.tdGroup) CONFIG.myTd = String(remote.tdGroup).trim();
    if (remote?.semester?.start && remote?.semester?.end) CONFIG.semester = { start: remote.semester.start, end: remote.semester.end };
    if (remote?.label) CONFIG.label = String(remote.label);
  } catch {
    /* edt.config.json absent (file://) : on garde les valeurs par défaut du code */
  }
}

async function fetchJson(url, init = {}, timeoutMs = CONFIG.requestTimeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { ...init, signal: controller.signal, cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function loadDataFile() {
  const json = await fetchJson(`${CONFIG.dataUrl}?v=${Math.floor(Date.now() / 60000)}`);
  if (!json || typeof json.weeks !== "object") throw new Error("data/edt.json illisible");
  return json;
}

async function loadFromCache() {
  try {
    const cached = JSON.parse(localStorage.getItem(`${CONFIG.cacheKey}_${CONFIG.group}`) || "null");
    if (!cached?.weeks) return null;
    return cached;
  } catch {
    return null;
  }
}

function saveToCache() {
  try {
    localStorage.setItem(`${CONFIG.cacheKey}_${CONFIG.group}`, JSON.stringify({ ts: Date.now(), weeks: state.weeks, generatedAt: state.generatedAt }));
  } catch { /* quota / mode privé */ }
}

/** Appel direct à CELCAT + repli par proxys publics (best effort). */
async function loadLiveEvents(startISO, endISO) {
  const body = new URLSearchParams({ start: startISO, end: endISO, resType: "103", calView: "agendaWeek", colourScheme: "3" });
  body.append("federationIds[]", CONFIG.group);
  const direct = `${CONFIG.apiUrl}?${body.toString()}`;
  // Chaque tentative ne « gagne » que si elle renvoie bien une liste d'événements.
  const validEvents = (promise) =>
    promise.then((payload) => {
      if (!Array.isArray(payload) || payload.length === 0) throw new Error("réponse CELCAT inattendue");
      return payload;
    });
  const attempts = [
    fetchJson(direct, { method: "GET" }),
    fetchJson(CONFIG.apiUrl, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" }, body: body.toString() }),
    ...CONFIG.proxies.map((proxy) => fetchJson(proxy.wrap(direct), { method: "GET" })),
  ].map(validEvents);
  return await Promise.any(attempts);
}

/** Récupère les semaines autour de la semaine affichée (par petits paquets). */
async function refreshFromLive(weekKey) {
  const start = addDaysISO(weekKey, -7);
  const end = addDaysISO(weekKey, 13);
  const events = await loadLiveEvents(start, end);
  const weeks = weeksFromEvents(events);
  const before = JSON.stringify(state.weeks);
  for (const [monday, week] of Object.entries(weeks)) state.weeks[monday] = week;
  return { changed: before !== JSON.stringify(state.weeks), count: events.length };
}

async function fetchSyncStatus() {
  const host = location.hostname;
  if (!host.endsWith(".github.io")) return null;
  const owner = host.split(".")[0];
  const url = `https://api.github.com/repos/${owner}/${host}/actions/workflows/edt-sync.yml/runs?per_page=1&status=success`;
  try {
    const json = await fetchJson(url, {}, 6000);
    const run = json?.workflow_runs?.[0];
    if (!run) return null;
    return new Date(run.updated_at || run.created_at);
  } catch {
    return null;
  }
}

/* ======================================================================
   RENDU
   ====================================================================== */
const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => document.querySelectorAll(selector);
let state_view = { weeks: [], index: 0, mobileFilter: "all", target: null };

function hourScaleHTML() {
  return `<div class="hour-scale" aria-hidden="true">${HOURS.map((hour) => {
    const top = TIMELINE.top + (hour * 60 - TIMELINE.start) * TIMELINE.pixelsPerMinute;
    return `<span style="top:${top}px">${pad2(hour)}:00</span>`;
  }).join("")}</div>`;
}

function position(slot) {
  const start = startMinutes(slot);
  const end = endMinutes(slot);
  return { top: Math.round(TIMELINE.top + (start - TIMELINE.start) * TIMELINE.pixelsPerMinute), height: Math.max(64, Math.round((end - start) * TIMELINE.pixelsPerMinute - 8)) };
}

function sameDay(a, b) { return a && b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

function currentTimeLine(day) {
  const now = new Date();
  if (!sameDay(day.realDate, now)) return "";
  const minutes = now.getHours() * 60 + now.getMinutes();
  if (minutes < TIMELINE.start || minutes > TIMELINE.end) return "";
  const top = TIMELINE.top + (minutes - TIMELINE.start) * TIMELINE.pixelsPerMinute;
  return `<div class="current-time-line" style="top:${Math.round(top)}px" role="presentation" aria-label="Heure actuelle"></div>`;
}

function isCourseRunning(item, day) {
  const now = new Date();
  if (!sameDay(day.realDate, now)) return false;
  const minutes = now.getHours() * 60 + now.getMinutes();
  return minutes >= item.startMin && minutes < item.endMin && !item.ghost;
}

function cardHTML(item, day) {
  const p = position(item.time);
  const classes = ["card", item.cat];
  if (item.isCancelled) classes.push("cancelled");
  if (item.ghost) classes.push("ghost");
  if (isCourseRunning(item, day)) classes.push("running");
  const details = [item.title, item.time, item.room, item.tag, item.note].filter(Boolean).join(" — ");
  const room = item.room ? `<div class="card-room" title="${escapeHtml(item.room)}">📍 ${escapeHtml(item.room)}</div>` : `<div class="card-room">📍 ${item.isCancelled ? "salle non précisée" : "lieu non précisé"}</div>`;
  const tag = item.tag ? `<div class="card-tag ${escapeHtml(item.tagType || "")}">${escapeHtml(item.tag)}</div>` : "";
  return `<article class="${classes.join(" ")}" style="top:${p.top}px;height:${p.height}px" tabindex="0" title="${escapeHtml(details)}"><div class="card-time"><span>${escapeHtml(item.time)}</span><span class="course-type">${escapeHtml(item.type)}</span></div><div class="card-title">${escapeHtml(item.title)}</div>${room}${tag}${item.note ? `<div class="card-note">${escapeHtml(item.note)}</div>` : ""}</article>`;
}

function emptyMessage(weekKey, dayIndex, live) {
  const date = addDaysISO(weekKey, dayIndex);
  if (date === "2026-10-22") return "🚫 Trophée SQY Campus — journée sans cours";
  if (date === "2026-11-11") return "🚫 Mercredi 11 novembre — université fermée";
  if (!live) return "🌴 Journée libre — aucun cours programmé";
  return "✅ Aucun cours au planning officiel pour cette journée";
}

/** Numéro de la semaine dans le semestre (1 = semaine du début du semestre). */
function weekNumber(weekKey) {
  const semStart = mondayOf(CONFIG.semester.start);
  if (weekKey < semStart || weekKey > CONFIG.semester.end) return null;
  return Math.round((parseISO(weekKey) - parseISO(semStart)) / (7 * 86400000)) + 1;
}

/**
 * Libellé d'une semaine, calculé à partir de sa date réelle (plus de titres
 * écrits à la main : ils deviendraient faux dès que le planning change).
 * Hors période universitaire, la semaine est simplement datée.
 */
function weekLabel(weekKey) {
  const start = parseISO(weekKey);
  const end = parseISO(addDaysISO(weekKey, 4));
  const number = weekNumber(weekKey);
  const dates = `${pad2(start.getDate())} ${MONTHS_LONG[start.getMonth()]} – ${pad2(end.getDate())} ${MONTHS_LONG[end.getMonth()]} ${end.getFullYear()}`;
  return {
    title: number ? `Semaine ${number} : ${dates}` : `Semaine du ${dates}`,
    index: fallbackWeeks.findIndex((week) => week.monday === weekKey),
  };
}

function currentWeekKey() {
  return mondayOf(todayISO());
}

/** Liste des semaines affichables : semestre + données live + semaine du jour. */
function buildWeekList() {
  const keys = new Set(fallbackWeeks.map((week) => week.monday));
  for (let cursor = mondayOf(CONFIG.semester.start); cursor <= CONFIG.semester.end; cursor = addDaysISO(cursor, 7)) keys.add(cursor);
  for (const [monday, week] of Object.entries(state.weeks)) if (week.events?.length && monday >= addDaysISO(CONFIG.semester.start, -14) && monday <= addDaysISO(CONFIG.semester.end, 14)) keys.add(monday);
  keys.add(currentWeekKey());
  return [...keys].sort();
}

function weekSource(weekKey) {
  const live = state.weeks[weekKey];
  if (live?.events?.length) return "live";
  if (live) return "live-empty";
  return REFERENCE_BY_MONDAY.has(weekKey) ? "reference" : "none";
}

/** Semaine affichée : données live + fantômes, ou référence en secours. */
function buildWeekView(weekKey, recurring) {
  const source = weekSource(weekKey);
  const reference = REFERENCE_BY_MONDAY.get(weekKey) ?? null;
  if (source === "live") return buildWeek(weekKey, state.weeks[weekKey].events, reference, { live: true, recurringCancellations: recurring });
  if (source === "live-empty") return buildWeek(weekKey, [], reference, { live: true, recurringCancellations: recurring });
  return buildWeek(weekKey, [], reference, { live: false });
}

function findTarget() {
  const now = new Date();
  const minutes = now.getHours() * 60 + now.getMinutes();
  const keys = state_view.weeks;
  const todayKey = currentWeekKey();
  const todayIndex = keys.indexOf(todayKey);
  if (todayIndex >= 0) {
    const view = buildWeekView(todayKey, null);
    const today = view.days.find((day) => sameDay(day.realDate, now));
    const todayCourses = (today?.courses ?? []).filter((item) => !item.isCancelled && !item.ghost);
    if (todayCourses.length && !todayCourses.every((item) => item.endMin <= minutes)) {
      return { weekIndex: todayIndex, dayIndex: DAY_NAMES.indexOf(today.name), ongoing: true };
    }
  }
  for (let w = Math.max(0, todayIndex); w < keys.length; w++) {
    const view = buildWeekView(keys[w], null);
    for (const day of view.days) {
      const dateKey = formatISO(day.realDate);
      if (dateKey < todayISO()) continue;
      if (!day.courses.some((item) => !item.isCancelled && !item.ghost)) continue;
      const ongoing = w === todayIndex && sameDay(day.realDate, now);
      return { weekIndex: w, dayIndex: DAY_NAMES.indexOf(day.name), ongoing, future: !ongoing };
    }
  }
  const last = keys.length - 1;
  return { weekIndex: last, dayIndex: 0, ongoing: false, future: true };
}

function renderWeek(index, options = {}) {
  const keys = state_view.weeks;
  index = Math.max(0, Math.min(index, keys.length - 1));
  state_view.index = index;
  const weekKey = keys[index];
  const recurring = options.recurring ?? state_view.recurring;
  state_view.recurring = recurring;
  const view = buildWeekView(weekKey, recurring);
  const label = weekLabel(weekKey);

  $("#weekTitle").textContent = label.title;
  $("#prev").disabled = index === 0;
  $("#next").disabled = index >= keys.length - 1;

  const target = options.target ?? findTarget();
  state_view.target = target;
  const targetWeek = target.weekIndex === index;

  $("#grid").innerHTML = view.days.map((day, dayIndex) => {
    const count = day.courses.length;
    const selected = targetWeek && target.dayIndex === dayIndex;
    const futureTarget = selected && !target.ongoing;
    const hidden = state_view.mobileFilter !== "all" && state_view.mobileFilter !== dayIndex;
    const indicator = selected ? `<span class="target-pill">${target.ongoing ? "📍 Aujourd'hui" : "🚀 Prochain cours"}</span>` : "";
    let content;
    if (count) {
      content = day.courses.map((item) => cardHTML(item, day)).join("");
    } else {
      content = `<div class="empty">${escapeHtml(emptyMessage(weekKey, dayIndex, view.live))}</div>`;
    }
    const countLabel = count ? `${count} cours` : "libre";
    return `<section class="day${selected ? " target" : ""}${futureTarget ? " future-target" : ""}${hidden ? " hidden" : ""}" data-day="${dayIndex}"><header class="day-head"><div><div class="day-name">${day.name}</div><div class="day-date"><time datetime="${formatISO(day.realDate)}">${day.date}</time></div>${indicator}</div><span class="day-count${count ? " has" : ""}">${countLabel}</span></header><div class="day-body">${hourScaleHTML()}${currentTimeLine(day)}${content}</div></section>`;
  }).join("");

  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) {
    $("#grid").animate([{ opacity: 0.4, transform: "translateY(5px)" }, { opacity: 1, transform: "translateY(0)" }], { duration: 180, easing: "ease-out" });
  }
  $$(".tab").forEach((tab) => tab.classList.toggle("current", targetWeek && tab.dataset.day === String(target.dayIndex)));
}

/* ------------------------------------------------------------------ print */
function printCourse(item) {
  const flag = item.ghost ? " • À VÉRIFIER" : item.isCancelled ? " • ANNULÉ" : "";
  const classes = ["p-item", item.cat];
  if (item.isCancelled) classes.push("cancelled");
  if (item.ghost) classes.push("ghost");
  return `<div class="${classes.join(" ")}"><span class="p-time">${escapeHtml(item.time)}</span><span class="p-type"> ${escapeHtml(item.type)}${flag}</span><br><b>${escapeHtml(item.title)}</b><br><span class="p-room">${escapeHtml(item.room || "lieu non précisé")} • ${escapeHtml(item.tag || "")}</span></div>`;
}

function buildPrintPage(pageWeeks, page, total, period) {
  const rows = pageWeeks.map(({ weekKey, number }) => {
    const view = buildWeekView(weekKey, state_view.recurring);
    const cells = view.days.map((day, dayIndex) => {
      if (day.courses.length) return `<td>${day.courses.map(printCourse).join("")}</td>`;
      const message = emptyMessage(weekKey, dayIndex, view.live);
      const special = /Trophée|fermée/.test(message);
      return `<td><div class="${special ? "p-alert" : "p-empty"}">${escapeHtml(message)}</div></td>`;
    }).join("");
    const start = parseISO(weekKey);
    const end = parseISO(addDaysISO(weekKey, 4));
    const label = number ? `Semaine ${number}` : weekKey < mondayOf(CONFIG.semester.start) ? "Avant-semestre" : "Hors semestre";
    return `<tr><td class="print-week"><b>${label}</b><span>${start.getDate()}/${pad2(start.getMonth() + 1)} – ${end.getDate()}/${pad2(end.getMonth() + 1)}</span></td>${cells}</tr>`;
  }).join("");
  return `<section class="print-page"><header class="print-head"><div><h2>UVSQ • L2 MIASHS S3 — ${escapeHtml(period)}</h2><p>Source : edt.uvsq.fr • Groupe ${CONFIG.group} • <strong>Page ${page} / ${total}</strong> • ${new Date().toLocaleString("fr-FR")}</p></div><div class="print-badge">Planning officiel • annulations et absences signalées</div></header><table class="print-table"><thead><tr><th>Semaine</th>${DAY_NAMES.map((day) => `<th>${day}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></section>`;
}

function buildPrint() {
  if (!state_view.weeks.length) return;
  const numbered = state_view.weeks.map((weekKey) => ({ weekKey, number: weekNumber(weekKey) }));
  const half = Math.ceil(numbered.length / 2);
  $("#print").innerHTML =
    buildPrintPage(numbered.slice(0, half), 1, 2, "1re partie") +
    buildPrintPage(numbered.slice(half), 2, 2, "2e partie");
}

/* ------------------------------------------------------------- thème/UI */
function initTheme() {
  const stored = localStorage.getItem("schedule_theme");
  const systemDark = matchMedia?.("(prefers-color-scheme:dark)").matches;
  applyTheme(stored || (systemDark ? "dark" : "light"));
}
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const button = $("#theme");
  const dark = theme === "dark";
  button.textContent = dark ? "☀ Clair" : "🌙 Sombre";
  button.title = dark ? "Passer en mode clair" : "Passer en mode sombre";
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("schedule_theme", next);
  applyTheme(next);
}

/** Change le groupe de TD affiché, mémorise le choix et rafraîchit le planning. */
function changeTd(tdValue) {
  if (!tdValue || !/^S3MIASHS TD [12]$/.test(tdValue)) return;
  if (tdValue === CONFIG.myTd) return;
  CONFIG.myTd = tdValue;
  try { localStorage.setItem("schedule_td", tdValue); } catch {}
  // Re-filtre les annulations récurrentes (dépendent du TD) et re-rend
  state_view.recurring = findRecurringCancellations(state.weeks);
  const target = findTarget();
  renderWeek(state_view.index, { target });
  buildPrint();
}

/** Initialise le sélecteur de TD avec la valeur courante. */
function initTdSelector() {
  const select = $("#tdSelect");
  if (!select) return;
  select.value = CONFIG.myTd;
  select.addEventListener("change", (e) => changeTd(e.target.value));
}

function changeWeek(delta) {
  const next = state_view.index + delta;
  if (next < 0 || next >= state_view.weeks.length) return;
  renderWeek(next);
  if (innerWidth <= 860 && state_view.mobileFilter !== "all") scrollToDay(state_view.mobileFilter, false);
}
function setDay(day, scroll = true) {
  state_view.mobileFilter = day === "all" ? "all" : Number(day);
  $$(".tab").forEach((tab) => {
    const active = tab.dataset.day === String(day);
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-pressed", String(active));
  });
  $$(".day").forEach((column) => column.classList.toggle("hidden", state_view.mobileFilter !== "all" && Number(column.dataset.day) !== state_view.mobileFilter));
  if (scroll && state_view.mobileFilter !== "all") scrollToDay(state_view.mobileFilter, false);
}
function scrollToDay(day, smooth = false) {
  const column = document.querySelector(`.day[data-day="${day}"]`);
  if (!column) return;
  const offset = innerWidth <= 860 ? ($("#tabs")?.offsetHeight || 42) + 10 : ($(".nav")?.offsetHeight || 0) + 20;
  const top = column.getBoundingClientRect().top + scrollY - offset;
  scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
}
function jumpToTarget(smooth = true) {
  const target = findTarget();
  renderWeek(target.weekIndex, { target });
  if (innerWidth <= 860 && state_view.mobileFilter !== "all") setDay(target.dayIndex, false);
  scrollToDay(target.dayIndex, smooth);
}
/* -------------------------------------------------------------- données */
let loadPromise = null;

async function loadEverything(options = {}) {
  if (loadPromise && !options.force) return loadPromise;
  loadPromise = (async () => {
    await applyRemoteConfig();
    const cached = await loadFromCache();
    if (cached?.weeks && Object.keys(cached.weeks).length) {
      state.weeks = cached.weeks;
      state.generatedAt = cached.generatedAt ?? null;
      state_view.recurring = findRecurringCancellations(state.weeks);
      state_view.weeks = buildWeekList();
      renderWeek(state_view.index);
    }

    const syncAt = await fetchSyncStatus();

    try {
      const file = await loadDataFile();
      if (!params.get("group") && file.group) CONFIG.group = String(file.group).trim();
      const hadData = Object.keys(state.weeks).length > 0;
      const same = JSON.stringify(file.weeks) === JSON.stringify(state.weeks);
      state.weeks = file.weeks ?? {};
      state.generatedAt = file.generatedAt ?? null;
      state_view.recurring = findRecurringCancellations(state.weeks);
      state_view.weeks = buildWeekList();
      saveToCache();
      if (!hadData) {
        const index = state_view.weeks.indexOf(currentWeekKey());
        renderWeek(index >= 0 ? index : state_view.index);
      } else if (!same) {
        renderWeek(state_view.index); // met à jour la semaine affichée sans changer de page
      }
      buildPrint();
    } catch (error) {
      console.warn("[edt] data/edt.json indisponible :", error.message);
    }

    const lastKnown = Math.max(syncAt?.getTime() ?? 0, state.generatedAt ? new Date(state.generatedAt).getTime() : 0);
    const stale = !lastKnown || Date.now() - lastKnown > CONFIG.dataMaxAgeMs;
    if (stale) {
      try {
        const { changed } = await refreshFromLive(currentWeekKey());
        state_view.recurring = findRecurringCancellations(state.weeks);
        state_view.weeks = buildWeekList();
        saveToCache();
        if (changed || options.force) renderWeek(state_view.index);
        buildPrint();
      } catch (error) {
        console.warn("[edt] appel direct CELCAT impossible (CORS) :", error.message);
      }
    }
    return state;
  })().finally(() => { loadPromise = null; });
  return loadPromise;
}

/* ----------------------------------------------------------- démarrage */
function initialize() {
  initTheme();
  initTdSelector();
  state_view.weeks = buildWeekList();
  const requested = params.get("week");
  const startIndex = requested && state_view.weeks.includes(mondayOf(requested)) ? state_view.weeks.indexOf(mondayOf(requested)) : Math.max(0, state_view.weeks.indexOf(currentWeekKey()));
  const target = findTarget();
  renderWeek(requested ? startIndex : target.weekIndex, { target });
  buildPrint();
  if (innerWidth <= 860) setDay(target.weekIndex === state_view.index ? target.dayIndex : 0, false);
  else setDay("all", false);
  requestAnimationFrame(() => scrollToDay(state_view.target?.dayIndex ?? 0, false));
  loadEverything().then(() => {
    if (!requested) {
      const fresh = findTarget();
      if (fresh.weekIndex !== state_view.index || fresh.dayIndex !== state_view.target?.dayIndex) renderWeek(fresh.weekIndex, { target: fresh });
      requestAnimationFrame(() => scrollToDay(state_view.target?.dayIndex ?? 0, false));
    }
  });
}

addEventListener("keydown", (event) => {
  if (event.key === "ArrowLeft") changeWeek(-1);
  if (event.key === "ArrowRight") changeWeek(1);
});
let startX = 0;
let startY = 0;
$("#grid").addEventListener("touchstart", (event) => { const touch = event.changedTouches[0]; startX = touch.clientX; startY = touch.clientY; }, { passive: true });
$("#grid").addEventListener("touchend", (event) => {
  const touch = event.changedTouches[0];
  const dx = touch.clientX - startX;
  const dy = touch.clientY - startY;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) changeWeek(dx < 0 ? 1 : -1);
}, { passive: true });
addEventListener("beforeprint", () => buildPrint());
addEventListener("DOMContentLoaded", initialize);
addEventListener("load", () => { if (state_view.target) scrollToDay(state_view.target.dayIndex, false); });
setInterval(() => { if (document.visibilityState === "visible") renderWeek(state_view.index); }, 60000);
setInterval(() => { if (document.visibilityState === "visible") loadEverything({ force: true }).then(() => renderWeek(state_view.index)).catch(() => {}); }, CONFIG.refreshMs);

if (typeof module !== "undefined" && module.exports) {
  module.exports = { parseEvent, isMyCourse, tagForLiveCourse, buildWeek, weeksFromEvents, findRecurringCancellations, mondayOf, addDaysISO, slotOf, familyOf, normalizeModuleName, normalizeGroupCode, decodeEntities };
}
