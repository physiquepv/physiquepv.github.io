<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Google</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Mon Site Web</h1>

    <div id="auth-container">
        <button id="login-btn">Se connecter avec Google</button>
        <button id="logout-btn" style="display:none;">Se déconnecter</button>
    </div>

    <p id="user-info">Non connecté</p>

    <script type="module">
        // Importation des SDK Firebase Web (v10)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // ⚠️ REMPLACEZ AVEC VOS PROPRES IDENTIFIANTS FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_PROJECT_ID.appspot.com",
            messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const userInfo = document.getElementById('user-info');

        // Connexion au clic
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const user = result.user;
                    
                    // Enregistrement de l'historique de connexion dans Firestore
                    await addDoc(collection(db, "logins"), {
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName,
                        timestamp: serverTimestamp() // Date et heure de connexion
                    });
                })
                .catch((error) => {
                    console.error("Erreur lors de la connexion :", error);
                });
        });

        // Déconnexion
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

        // Écouter le statut de l'utilisateur
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginBtn.style.display = "none";
                logoutBtn.style.display = "inline-block";
                userInfo.innerText = `Connecté en tant que : ${user.displayName} (${user.email})`;
            } else {
                loginBtn.style.display = "inline-block";
                logoutBtn.style.display = "none";
                userInfo.innerText = "Non connecté";
            }
        });
    </script>
</body>
</html>
