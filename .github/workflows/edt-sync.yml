name: Sync emploi du temps UVSQ

# Récupère le planning officiel CELCAT (edt.uvsq.fr) et l'écrit dans data/edt.json.
# Depuis octobre 2026, edt.uvsq.fr exige une session LDAP UVSQ (/LdapLogin) :
# le script ouvre cette session à partir des secrets GitHub Actions
# CELCAT_USERNAME et CELCAT_PASSWORD, récupère les créneaux du groupe (aucune
# donnée nominative n'est écrite dans le dépôt) et publie data/edt.json.

on:
  schedule:
    # Rafraîchissement glissant toutes les 15 min du lundi au samedi (~06h–23h Paris).
    # Le samedi est inclus volontairement : l'université peut y publier des cours.
    - cron: "*/15 4-21 * * 1-6"
    # Veille du dimanche (~08h–22h Paris, 1×/heure) pour capter les annonces du lundi matin.
    - cron: "12 6-20 * * 0"
    # Rechargement complet du semestre (et aperçu du suivant), chaque matin (~05:17 / 06:17 Paris).
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Recharger tout le semestre (sinon : fenêtre glissante)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore:
      - "data/**" # évite de boucler sur ses propres commits

permissions:
  contents: write
  actions: read

concurrency:
  group: edt-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Récupérer le planning CELCAT
        env:
          EDT_FULL: ${{ (github.event.schedule == '17 4 * * *' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full != false)) && '1' || '0' }}
          CELCAT_USERNAME: ${{ secrets.CELCAT_USERNAME }}
          CELCAT_PASSWORD: ${{ secrets.CELCAT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node scripts/sync-edt.mjs 2>&1 | tee /tmp/sync.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 2 ]; then
            {
              echo "### 🔑 Configuration requise (une seule fois) : secrets UVSQ"
              echo
              echo "Depuis octobre 2026, \`edt.uvsq.fr\` redirige vers \`/LdapLogin\` et bloque l'accès anonyme."
              echo "Pour activer la synchronisation automatique :"
              echo
              echo "1. Ouvrez **Settings → Secrets and variables → Actions → New repository secret**."
              echo "2. Ajoutez **\`CELCAT_USERNAME\`** : votre identifiant ENT UVSQ (numéro étudiant, **sans** \`@etu.uvsq.fr\`)."
              echo "3. Ajoutez **\`CELCAT_PASSWORD\`** : votre mot de passe ENT UVSQ."
              echo "4. Revenez dans **Actions → Sync emploi du temps UVSQ → Run workflow**."
              echo
              echo "_Ces secrets restent chiffrés côté GitHub Actions et ne sont jamais exposés dans le site ni dans \`data/edt.json\`._"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
              # En mode automatique (schedule / push), ne pas casser le statut du dépôt
              # ni envoyer d'e-mails d'échec tant que les secrets ne sont pas créés.
              exit 0
            fi
            exit 2
          fi
          if [ "$code" -ne 0 ]; then
            if ! grep -q '::error' /tmp/sync.log; then
              msg=$(tail -c 1200 /tmp/sync.log | tr '\n' ' ' | sed 's/%/%25/g')
              echo "::error title=Synchro CELCAT en échec::${msg}"
            fi
            {
              echo "### :x: Synchro CELCAT en échec"
              echo '```'
              tail -c 3000 /tmp/sync.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Publier data/edt.json
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/edt.json)" ]; then
            echo "Planning inchangé : rien à publier."
            exit 0
          fi
          cp data/edt.json /tmp/edt.json.published
          # Le message de commit annonce ce qui a bougé (annulation, nouveau cours…) :
          # l'historique du dépôt devient la chronologie des changements.
          subject=$(node scripts/sync-edt.mjs --summary-subject || true)
          summary=$(node scripts/sync-edt.mjs --summary || true)
          if [ -n "$subject" ]; then
            message="chore(edt): planning synchronisé — $subject"
          else
            message="chore(edt): planning synchronisé ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          fi
          git config user.name "edt-sync[bot]"
          git config user.email "edt-sync@users.noreply.github.com"
          git add data/edt.json
          git commit -m "$message" -m "$summary"

          pushed=0
          if git push origin HEAD:main; then
            pushed=1
          else
            # Si un commit est arrivé sur main pendant la synchro, on rejoue proprement dessus.
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/edt.json.published data/edt.json
            if [ -z "$(git status --porcelain -- data/edt.json)" ]; then
              echo "Planning déjà aligné sur main."
              exit 0
            fi
            git add data/edt.json
            git commit -m "$message" -m "$summary"
            if git push origin HEAD:main; then
              pushed=1
            fi
          fi

          if [ "$pushed" -eq 1 ]; then
            {
              echo
              echo "### Planning publié"
              echo
              echo "**$message**"
              echo
              echo "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Impossible d'écrire data/edt.json"
              echo
              echo "Le jeton du workflow n'a pas le droit de pousser. Active-le une fois :"
              echo "**Settings → Actions → General → Workflow permissions → Read and write permissions**, puis relance ce workflow."
              echo
              echo "En attendant, le site continue d'afficher la dernière version publiée de data/edt.json."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Push refusé (permissions du GITHUB_TOKEN). Voir Settings → Actions → General → Workflow permissions."
          fi

      - name: Artefact de diagnostic
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: edt-json
          path: data/edt.json
          if-no-files-found: ignore
          retention-days: 3
